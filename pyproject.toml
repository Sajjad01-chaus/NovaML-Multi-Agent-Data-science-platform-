[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaml"
version = "0.2.0"
description = "Autonomous multi-agent data science platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
groq = ["langchain-groq>=0.3", "langchain-core>=0.3", "groq>=0.30"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]

[project.scripts]
novaml = "novaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: calls a real LLM provider (needs API key; skipped by default)",
    "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
