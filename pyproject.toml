[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "novaml"
version = "0.2.0"
description = "Autonomous multi-agent data science platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "joblib>=1.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.2",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.70"]
groq = ["langchain-groq>=0.3", "langchain-core>=0.3", "groq>=0.30"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "boto3>=1.34",
]
ui = ["streamlit>=1.35", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110", "moto[s3]>=5"]

[project.scripts]
novaml = "novaml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "services: needs real Postgres/S3 (NOVAML_TEST_DATABASE_URL, NOVAML_TEST_S3_ENDPOINT)",
    "live: calls a real LLM provider (needs API key; skipped by default)",
    "slow: slower end-to-end tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares request parameters with these calls in argument defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Header", "fastapi.Query", "fastapi.Body"]
