name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,serve,ui,groq,anthropic]"
      - run: ruff check src tests
      - run: pytest -m "not live" --cov=novaml --cov-report=term-missing
